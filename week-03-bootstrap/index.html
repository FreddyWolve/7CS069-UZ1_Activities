<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 3 Activities</title>
    <!-- Bootstrap CSS (Activity 1: Responsive Layouts) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Activity 1: Grid Layout Container -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <!-- Activity 3: UI Pattern (Bootstrap Card) -->
          <div class="card shadow border-0">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4">Activity Portal</h2>

              <!-- Activity 2: Usable Mobile Form -->
              <form>
                <div class="mb-3">
                  <label for="userEmail" class="form-label"
                    >Email address</label
                  >
                  <input
                    type="email"
                    class="form-control form-control-lg"
                    id="userEmail"
                    placeholder="username@wlv.ac.uk"
                  />
                </div>
                <div class="mb-3">
                  <label for="userPassword" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="userPassword"
                  />
                </div>
                <div class="mb-3 form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="rememberMe"
                  />
                  <label class="form-check-label" for="rememberMe"
                    >Keep me signed in</label
                  >
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                  Submit Application
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
